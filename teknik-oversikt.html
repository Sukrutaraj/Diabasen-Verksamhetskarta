<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tekniköversikt – Diabasen</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 0; }
    .page-container { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; color: #2c3e50; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 0.92rem; margin-bottom: 24px; }

    .stats-bar {
      display: flex; gap: 20px; flex-wrap: wrap;
      background: #fff; border-radius: 10px;
      padding: 12px 18px; margin-bottom: 24px;
      border: 1px solid #e0e6ed; font-size: 0.9rem; color: #555;
    }
    .stat { display: flex; align-items: center; gap: 6px; }
    .stat strong { color: #2c3e50; font-size: 1.05rem; }

    .group-section { margin-bottom: 28px; }
    .group-title {
      font-size: 1rem; font-weight: 700; color: #fff;
      background: #2c5f8a; padding: 8px 14px;
      border-radius: 8px 8px 0 0; margin: 0;
    }
    .group-rows {
      border: 2px solid #d0d9e4; border-top: none;
      border-radius: 0 0 8px 8px; overflow: hidden;
    }
    .tech-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: #fff;
      border-bottom: 1px solid #edf0f3; flex-wrap: wrap;
    }
    .tech-row:last-child { border-bottom: none; }
    .tech-row:hover { background: #f7f9fb; }

    .tech-name {
      font-weight: 600; font-size: 0.93rem;
      color: #2c3e50; min-width: 155px; flex: 1;
    }
    .cl-chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 3; }

    .cl-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: #e8f4e8; color: #1b6b2f;
      border: 1px solid #b7dfbf; border-radius: 20px;
      padding: 3px 10px; font-size: 0.8rem; font-weight: 600;
      text-decoration: none; transition: background 0.15s;
    }
    .cl-chip:hover { background: #d0edcf; }
    .cl-del-chip {
      background: none; border: none; cursor: pointer;
      font-size: 0.75rem; padding: 0 0 0 2px;
      color: #1b6b2f; opacity: 0.6; line-height: 1;
    }
    .cl-del-chip:hover { opacity: 1; }

    .cl-empty { color: #bbb; font-size: 0.83rem; font-style: italic; }

    .add-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: none; border: 1.5px dashed #aac4de;
      color: #2c5f8a; border-radius: 20px;
      padding: 3px 10px; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .add-btn:hover { background: #e8f0f8; border-color: #2c5f8a; }

    /* Lösenordsskärm */
    .pwd-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 70vh;
    }
    .pwd-box {
      background: #fff; border: 2px solid #d0d9e4;
      border-radius: 12px; padding: 28px 28px 22px;
      width: 100%; max-width: 300px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08); text-align: center;
    }
    .pwd-box h2 { color: #2c3e50; margin: 0 0 6px; font-size: 1.1rem; }
    .pwd-box p { color: #888; font-size: 0.85rem; margin: 0 0 18px; }
    .pwd-box input {
      width: 100%; box-sizing: border-box;
      padding: 10px 12px; border: 1.5px solid #d0d7de;
      border-radius: 8px; font-size: 1rem;
      font-family: inherit; margin-bottom: 10px; text-align: center;
    }
    .pwd-box input:focus { outline: none; border-color: #2c5f8a; }
    .pwd-login-btn {
      width: 100%; background: #2c5f8a; color: #fff;
      border: none; border-radius: 8px; padding: 11px;
      font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .pwd-login-btn:hover { background: #1e4a6e; }
    .pwd-err { color: #a12020; font-size: 0.85rem; margin-top: 8px; display: none; }
    .main-content { display: none; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 12px;
      padding: 24px 22px 20px; width: 90%; max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-heading { font-size: 1rem; font-weight: 700; color: #2c3e50; margin: 0 0 14px; }
    .modal label { font-size: 0.82rem; font-weight: 600; color: #555; display: block; margin-bottom: 3px; }
    .modal input {
      width: 100%; box-sizing: border-box; padding: 8px 11px;
      border: 1.5px solid #d0d7de; border-radius: 7px;
      font-size: 0.92rem; font-family: inherit; margin-bottom: 10px;
    }
    .modal input:focus { outline: none; border-color: #2c5f8a; }

    .modal-queue { margin: 12px 0; }
    .queue-item {
      display: flex; align-items: center; gap: 8px;
      background: #e8f4e8; border: 1px solid #b7dfbf;
      border-radius: 8px; padding: 6px 10px; margin-bottom: 6px;
      font-size: 0.85rem; color: #1b6b2f; font-weight: 600;
    }
    .queue-item span { flex: 1; }
    .queue-remove {
      background: none; border: none; cursor: pointer;
      color: #1b6b2f; opacity: 0.6; font-size: 0.9rem; padding: 0;
    }
    .queue-remove:hover { opacity: 1; }

    .add-more-btn {
      background: #f0f6ff; border: 1.5px dashed #aac4de;
      color: #2c5f8a; border-radius: 8px; padding: 7px 14px;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      font-family: inherit; width: 100%; margin-bottom: 12px;
    }
    .add-more-btn:hover { background: #e0edfb; }

    .modal-btns { display: flex; gap: 10px; }
    .modal-save {
      background: #2c5f8a; color: #fff; border: none;
      border-radius: 8px; padding: 9px 18px;
      font-size: 0.92rem; font-weight: 700; cursor: pointer; font-family: inherit; flex: 1;
    }
    .modal-save:hover:not(:disabled) { background: #1e4a6e; }
    .modal-save:disabled { opacity: 0.6; cursor: not-allowed; }
    .modal-cancel {
      background: #f0f0f0; color: #555; border: none;
      border-radius: 8px; padding: 9px 18px;
      font-size: 0.92rem; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .modal-cancel:hover { background: #e0e0e0; }
    .modal-msg {
      font-size: 0.88rem; padding: 7px 11px;
      border-radius: 7px; margin-top: 10px; display: none;
    }
    .modal-msg.ok { background: #e6f4ea; color: #1b6b2f; border: 1px solid #b7dfbf; }
    .modal-msg.err { background: #fde8e8; color: #a12020; border: 1px solid #f5b8b8; }

    .divider { border: none; border-top: 1px solid #eee; margin: 12px 0; }
    .loading-msg { color: #888; font-size: 0.9rem; padding: 8px 14px; }

    @media (max-width: 520px) {
      .tech-row { flex-direction: column; align-items: flex-start; }
      .tech-name { min-width: unset; }
    }
  </style>
</head>
<body>

<!-- Lösenordsskärm -->
<div class="pwd-screen" id="pwd-screen">
  <div class="pwd-box">
    <h2>🔒 Tekniköversikt</h2>
    <p>Endast för personal</p>
    <input type="password" id="pwd-input" placeholder="Lösenord" />
    <button class="pwd-login-btn" id="pwd-login-btn">Logga in</button>
    <div class="pwd-err" id="pwd-err">Fel lösenord, försök igen.</div>
  </div>
</div>

<!-- Huvudinnehåll -->
<div class="main-content" id="main-content">
  <div class="page-container">
    <div class="back-link"><a href="index.html">← Tillbaka till kartan</a></div>
    <h1>📋 Tekniköversikt – Diabasen</h1>
    <p class="subtitle">Alla teknikchecklistor samlade. Gröna märken = checklista finns. Klicka "+ Lägg till" för att lägga till fler.</p>
    <div class="stats-bar" id="stats-bar"><div class="stat">Laddar…</div></div>
    <div id="overview-container"><div class="loading-msg">Hämtar checklistor…</div></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-heading" id="modal-heading">Lägg till checklista</div>

    <!-- Lösenord (visas bara första gången) -->
    <div id="pwd-section">
      <label>Lösenord</label>
      <input type="password" id="modal-pwd" placeholder="Teknik0426" />
    </div>
    <hr class="divider">

    <!-- Formulär för en checklista -->
    <label>Titel</label>
    <input type="text" id="modal-cl-title" placeholder="T.ex. Starta maskinen" />
    <label>Länk till checklistan</label>
    <input type="url" id="modal-url" placeholder="https://sukrutaraj.github.io/digital-checklist-maker/…" />
    <label>Ditt namn</label>
    <input type="text" id="modal-name" placeholder="Förnamn" />

    <button class="add-more-btn" id="add-to-queue-btn">+ Lägg till i kön</button>

    <!-- Kö med checklistor som ska sparas -->
    <div class="modal-queue" id="modal-queue" style="display:none">
      <div style="font-size:0.82rem;font-weight:600;color:#555;margin-bottom:6px;">Ska sparas:</div>
      <div id="queue-list"></div>
    </div>

    <div class="modal-btns">
      <button class="modal-save" id="modal-save">Spara alla</button>
      <button class="modal-cancel" id="modal-cancel">Avbryt</button>
    </div>
    <div class="modal-msg" id="modal-msg"></div>
  </div>
</div>

<script>
const REPO      = 'sukrutaraj/Diabasen-Verksamhetskarta';
const BRANCH    = 'main';
const FOLDER    = 'checklists';
const BASE      = 'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/';
const API       = 'https://api.github.com/repos/' + REPO + '/contents/';
const TOKEN_ENC = '330d1b310b5c0772544317515c1f2127065001710013333a5a3363037702605532085a5f005a5b6e';
const PWD_HASH  = '79b497e2';

const TECH_PAGES = [
  { group: 'Grupp 1', items: [
    { name: '3D-skrivare',        file: 'grupp1-3d' },
    { name: 'Datorer',            file: 'grupp1-datorer' },
    { name: 'iPad & Mobil',       file: 'grupp1-mobil' },
    { name: 'Musik & Inspelning', file: 'grupp1-musik' },
  ]},
  { group: 'Grupp 2', items: [
    { name: 'Datorer',            file: 'grupp2-datorer' },
    { name: 'Fliptavla',          file: 'grupp2-fliptavla' },
    { name: 'iPad & Telefon',     file: 'grupp2-ipad' },
    { name: 'Tidshjälpmedel',     file: 'grupp2-tid' },
    { name: 'Touch',              file: 'grupp2-touch' },
  ]},
  { group: 'Grupp 3', items: [
    { name: 'Fliptavla',          file: 'grupp3-fliptavla' },
    { name: 'iPad',               file: 'grupp3-ipad' },
  ]},
  { group: 'Grupp 4 & 5', items: [
    { name: 'AI',                 file: 'grupp45-ai' },
    { name: 'Datorer',            file: 'grupp45-datorer' },
    { name: 'iPad',               file: 'grupp45-ipad' },
    { name: 'Speldatorer',        file: 'grupp45-speldatorer' },
  ]},
  { group: 'Matsalen', items: [
    { name: 'Datorer',            file: 'matsalen-datorer' },
    { name: 'Fliptavla',          file: 'matsalen-flip' },
  ]},
  { group: 'Slångbellan', items: [
    { name: '3D-skrivare',        file: 'slangbellan-3d' },
    { name: 'Fliptavla',          file: 'slangbellan-fliptavla' },
    { name: 'Info',               file: 'slangbellan-info' },
    { name: 'Makey Makey',        file: 'slangbellan-makeymakey' },
    { name: 'Mobil',              file: 'slangbellan-mobil' },
    { name: 'Planering',          file: 'slangbellan-planering' },
  ]},
];

// --- Krypto ---
function checkPwd(pwd) {
  let h = 0;
  for (let i = 0; i < pwd.length; i++) h = (Math.imul(31, h) + pwd.charCodeAt(i)) | 0;
  return Math.abs(h).toString(16) === PWD_HASH;
}
function xorStr(str, key) {
  let out = '';
  for (let i = 0; i < str.length; i++)
    out += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  return out;
}
function decodeToken(enc, pwd) {
  const bytes = enc.match(/.{1,2}/g).map(h => String.fromCharCode(parseInt(h, 16)));
  return xorStr(bytes.join(''), pwd);
}

// --- GitHub API ---
async function ghGet(path) {
  const r = await fetch(API + path + '?ref=' + BRANCH, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function ghPut(path, content, message, token) {
  const r = await fetch(API + path, {
    method: 'PUT',
    headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
    body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(content))), branch: BRANCH })
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || r.status); }
  return r.json();
}
async function ghDelete(path, sha, message, token) {
  const r = await fetch(API + path, {
    method: 'DELETE',
    headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
    body: JSON.stringify({ message, sha, branch: BRANCH })
  });
  if (!r.ok) throw new Error('Borttagning: ' + r.status);
}

async function fetchAllChecklists() {
  try {
    const files = await ghGet(FOLDER);
    const metaFiles = files.filter(f => f.name.startsWith('meta_') && f.name.endsWith('.json'));
    const items = [];
    for (const mf of metaFiles) {
      try {
        const r = await fetch(BASE + FOLDER + '/' + mf.name);
        if (!r.ok) continue;
        const meta = await r.json();
        items.push({ ...meta, _file: mf.name, _sha: mf.sha });
      } catch(e) {}
    }
    return items;
  } catch(e) { return []; }
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- Rendera ---
function render(allChecklists) {
  const container = document.getElementById('overview-container');
  container.innerHTML = '';
  let total = 0, withCl = 0;

  TECH_PAGES.forEach(group => {
    const section = document.createElement('div');
    section.className = 'group-section';
    section.innerHTML = `<h2 class="group-title">${group.group}</h2><div class="group-rows"></div>`;
    container.appendChild(section);
    const rowsEl = section.querySelector('.group-rows');

    group.items.forEach(item => {
      total++;
      const pageCls = allChecklists.filter(cl => cl.page === item.file);
      if (pageCls.length > 0) withCl++;

      const row = document.createElement('div');
      row.className = 'tech-row';

      const nameEl = document.createElement('div');
      nameEl.className = 'tech-name';
      nameEl.textContent = item.name;

      const chipsEl = document.createElement('div');
      chipsEl.className = 'cl-chips';

      if (pageCls.length === 0) {
        chipsEl.innerHTML = `<span class="cl-empty">Ingen checklista än</span>`;
      } else {
        pageCls.sort((a,b) => a.id - b.id).forEach(cl => {
          const chip = document.createElement('span');
          chip.style.display = 'inline-flex';
          chip.style.alignItems = 'center';
          chip.innerHTML = `
            <a href="${cl.url}" target="_blank" rel="noopener" class="cl-chip">
              ✅ ${escHtml(cl.title)}
            </a>
            <button class="cl-del-chip" title="Ta bort" data-file="${cl._file}" data-sha="${cl._sha}" data-title="${escHtml(cl.title)}">✕</button>
          `;
          chip.querySelector('.cl-del-chip').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            const pwd = prompt('Lösenord för att ta bort "' + btn.dataset.title + '":');
            if (!pwd) return;
            if (!checkPwd(pwd)) { alert('Fel lösenord!'); return; }
            const token = decodeToken(TOKEN_ENC, pwd);
            btn.disabled = true;
            try {
              await ghDelete(FOLDER + '/' + btn.dataset.file, btn.dataset.sha, 'Ta bort checklista: ' + btn.dataset.title, token);
              init();
            } catch(e) {
              alert('Fel: ' + e.message);
              btn.disabled = false;
            }
          });
          chipsEl.appendChild(chip);
        });
      }

      const addBtn = document.createElement('button');
      addBtn.className = 'add-btn';
      addBtn.textContent = '+ Lägg till';
      addBtn.addEventListener('click', () => openModal(item));

      row.appendChild(nameEl);
      row.appendChild(chipsEl);
      row.appendChild(addBtn);
      rowsEl.appendChild(row);
    });
  });

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat">📄 <strong>${total}</strong> tekniksidor</div>
    <div class="stat">✅ <strong>${withCl}</strong> har checklista</div>
    <div class="stat">⬜ <strong>${total - withCl}</strong> saknar checklista</div>
  `;
}

// --- Modal med kö ---
let currentItem = null;
let queue = [];
let unlockedToken = null;

function openModal(item) {
  currentItem = item;
  queue = [];
  unlockedToken = null;
  document.getElementById('modal-heading').textContent = item.name + ' – ' + item.group || item.name;
  document.getElementById('modal-pwd').value = '';
  document.getElementById('modal-cl-title').value = '';
  document.getElementById('modal-url').value = '';
  document.getElementById('modal-name').value = '';
  document.getElementById('modal-msg').style.display = 'none';
  document.getElementById('modal-queue').style.display = 'none';
  document.getElementById('queue-list').innerHTML = '';
  document.getElementById('pwd-section').style.display = 'block';
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal-pwd').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  currentItem = null; queue = []; unlockedToken = null;
}

function renderQueue() {
  const qList = document.getElementById('queue-list');
  qList.innerHTML = '';
  queue.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'queue-item';
    div.innerHTML = `<span>✅ ${escHtml(q.title)}</span><button class="queue-remove" data-i="${i}">✕</button>`;
    div.querySelector('.queue-remove').addEventListener('click', () => {
      queue.splice(i, 1);
      if (queue.length === 0) document.getElementById('modal-queue').style.display = 'none';
      else renderQueue();
    });
    qList.appendChild(div);
  });
  document.getElementById('modal-queue').style.display = queue.length > 0 ? 'block' : 'none';
}

document.getElementById('add-to-queue-btn').addEventListener('click', () => {
  const msgEl = document.getElementById('modal-msg');
  function showErr(t) { msgEl.textContent = t; msgEl.className = 'modal-msg err'; msgEl.style.display = 'block'; }

  const pwd   = document.getElementById('modal-pwd').value.trim();
  const title = document.getElementById('modal-cl-title').value.trim();
  const url   = document.getElementById('modal-url').value.trim();
  const name  = document.getElementById('modal-name').value.trim();

  if (!unlockedToken) {
    if (!pwd) { showErr('Ange lösenord.'); return; }
    if (!checkPwd(pwd)) { showErr('Fel lösenord!'); return; }
    unlockedToken = decodeToken(TOKEN_ENC, pwd);
    document.getElementById('pwd-section').style.display = 'none';
  }
  if (!title || !url) { showErr('Fyll i titel och länk.'); return; }

  queue.push({ title, url, name: name || 'Okänd' });
  renderQueue();
  document.getElementById('modal-cl-title').value = '';
  document.getElementById('modal-url').value = '';
  document.getElementById('modal-msg').style.display = 'none';
  document.getElementById('modal-cl-title').focus();
});

document.getElementById('modal-save').addEventListener('click', async () => {
  const msgEl = document.getElementById('modal-msg');
  function showMsg(t, ok) { msgEl.textContent = t; msgEl.className = 'modal-msg ' + (ok?'ok':'err'); msgEl.style.display = 'block'; }

  // Kolla om det finns något i formuläret som inte lagts till i kön
  const title = document.getElementById('modal-cl-title').value.trim();
  const url   = document.getElementById('modal-url').value.trim();
  const name  = document.getElementById('modal-name').value.trim();
  const pwd   = document.getElementById('modal-pwd').value.trim();

  if (!unlockedToken) {
    if (!pwd) { showMsg('Ange lösenord.', false); return; }
    if (!checkPwd(pwd)) { showMsg('Fel lösenord!', false); return; }
    unlockedToken = decodeToken(TOKEN_ENC, pwd);
    document.getElementById('pwd-section').style.display = 'none';
  }

  if (title && url) queue.push({ title, url, name: name || 'Okänd' });

  if (queue.length === 0) { showMsg('Lägg till minst en checklista.', false); return; }

  const btn = document.getElementById('modal-save');
  btn.disabled = true;
  btn.textContent = 'Sparar…';

  try {
    for (const q of queue) {
      const id   = Date.now() + Math.floor(Math.random()*1000);
      const meta = { id, title: q.title, url: q.url, addedBy: q.name, date: new Date().toISOString(), page: currentItem.file };
      await ghPut(FOLDER + '/meta_' + id + '.json', JSON.stringify(meta, null, 2), 'Lägg till checklista: ' + q.title, unlockedToken);
      await new Promise(r => setTimeout(r, 300)); // kort paus mellan anrop
    }
    showMsg('✅ ' + queue.length + ' checklista' + (queue.length > 1 ? 'r' : '') + ' sparad' + (queue.length > 1 ? 'e' : '') + '!', true);
    setTimeout(() => { closeModal(); init(); }, 1800);
  } catch(e) {
    showMsg('Fel: ' + e.message, false);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Spara alla';
  }
});

document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });

// --- Lösenord ---
document.getElementById('pwd-login-btn').addEventListener('click', () => {
  const pwd = document.getElementById('pwd-input').value.trim();
  if (checkPwd(pwd)) {
    sessionStorage.setItem('cl_auth', '1');
    document.getElementById('pwd-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    init();
  } else {
    document.getElementById('pwd-err').style.display = 'block';
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
  }
});
document.getElementById('pwd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pwd-login-btn').click();
});

async function init() {
  document.getElementById('overview-container').innerHTML = '<div class="loading-msg">Hämtar checklistor…</div>';
  const all = await fetchAllChecklists();
  render(all);
}

if (sessionStorage.getItem('cl_auth') === '1') {
  document.getElementById('pwd-screen').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
  init();
}
</script>
</body>
</html>
